<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; color: #333; padding: 12px; background: #fff; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .header h2 { font-size: 13px; font-weight: 600; }
    .status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .status.connected { background: #ecfdf5; color: #047857; }
    .status.disconnected { background: #fef2f2; color: #b91c1c; }
    .status.connecting { background: #fefce8; color: #a16207; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.on { background: #10b981; }
    .dot.off { background: #ef4444; }
    .dot.wait { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .section { margin-bottom: 12px; }
    .section-title { font-size: 11px; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .log { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.6; color: #4b5563; }
    .log .error { color: #b91c1c; }
    .log .success { color: #047857; }

    .config { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .config input { flex: 1; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 11px; font-family: ui-monospace, monospace; }
    .btn { padding: 4px 10px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: #409EFF; color: #fff; }
    .btn-primary:hover { background: #337ecc; }
    .btn-ghost { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-ghost:hover { background: #e5e7eb; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; text-align: center; }
    .stat-value { font-size: 16px; font-weight: 700; color: #111827; }
    .stat-label { font-size: 10px; color: #6b7280; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>EP Page Builder</h2>
    <span class="status disconnected" id="statusBadge"><span class="dot off" id="statusDot"></span><span id="statusText">未连接</span></span>
  </div>

  <div class="section">
    <div class="section-title">WebSocket 地址</div>
    <div class="config">
      <input id="wsUrl" value="ws://localhost:9222" />
      <button class="btn btn-primary" id="btnConnect" onclick="toggleConnection()">连接</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="statPages">0</div><div class="stat-label">已生成页面</div></div>
    <div class="stat"><div class="stat-value" id="statComponents">0</div><div class="stat-label">已放置组件</div></div>
  </div>

  <div class="section" style="margin-top: 12px">
    <div class="section-title">日志</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    let ws = null;
    let connected = false;
    let stats = { pages: 0, components: 0 };

    function log(msg, type) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      if (type) line.className = type;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(state) {
      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const btn = document.getElementById('btnConnect');
      badge.className = `status ${state}`;
      dot.className = `dot ${state === 'connected' ? 'on' : state === 'connecting' ? 'wait' : 'off'}`;
      text.textContent = state === 'connected' ? '已连接' : state === 'connecting' ? '连接中…' : '未连接';
      btn.textContent = state === 'connected' ? '断开' : '连接';
    }

    function updateStats() {
      document.getElementById('statPages').textContent = stats.pages;
      document.getElementById('statComponents').textContent = stats.components;
    }

    function toggleConnection() {
      if (connected) {
        ws.close();
        return;
      }
      const url = document.getElementById('wsUrl').value;
      setStatus('connecting');
      log(`正在连接 ${url}...`);

      ws = new WebSocket(url);
      ws.onopen = () => {
        connected = true;
        setStatus('connected');
        log('WebSocket 已连接', 'success');
        ws.send(JSON.stringify({ type: 'register', client: 'figma-plugin', version: '1.0.0' }));
      };
      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'layout-spec') {
            log(`收到 Layout Spec: "${msg.data.page}"`, 'success');
            // Forward to plugin code
            parent.postMessage({ pluginMessage: { type: 'build-page', spec: msg.data } }, '*');
          } else if (msg.type === 'ping') {
            ws.send(JSON.stringify({ type: 'pong' }));
          } else {
            log(`收到: ${msg.type}`);
          }
        } catch (e) {
          log(`消息解析失败: ${e.message}`, 'error');
        }
      };
      ws.onerror = (e) => {
        log('连接错误', 'error');
      };
      ws.onclose = () => {
        connected = false;
        setStatus('disconnected');
        log('连接已断开');
      };
    }

    // Listen for messages from plugin code (stats updates, errors)
    window.onmessage = (evt) => {
      const msg = evt.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'stats') {
        stats = msg.data;
        updateStats();
      } else if (msg.type === 'log') {
        log(msg.text, msg.level);
      } else if (msg.type === 'done') {
        log(`页面 "${msg.pageName}" 生成完成，共 ${msg.componentCount} 个组件`, 'success');
        if (ws && connected) {
          ws.send(JSON.stringify({ type: 'build-complete', page: msg.pageName, components: msg.componentCount }));
        }
      } else if (msg.type === 'error') {
        log(`错误: ${msg.text}`, 'error');
        if (ws && connected) {
          ws.send(JSON.stringify({ type: 'build-error', error: msg.text }));
        }
      }
    };

    // Auto-connect on load
    setTimeout(() => toggleConnection(), 500);
  </script>
</body>
</html>
